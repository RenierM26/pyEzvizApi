name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - "pyezvizapi/**"
      - "examples/**"
      - "pyproject.toml"
      - ".ruff.toml"
      - "pytest.ini"
      - "tests/**"
      - "tools/apk-re/**"
      - "tools/local_av_lan_session.ps1"
      - "discovery/apk/**"
      - ".github/workflows/**"
      - "!**/*.md"
      - "!docs/**"
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    name: lint-test (py${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Upgrade pip
        run: python -m pip install -U pip wheel

      - name: Install project + dev deps
        run: pip install -e .[dev,streaming]

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Ruff
        run: ruff check .

      - name: Codespell
        if: matrix.python-version == '3.12'
        run: codespell pyezvizapi tests README.md pyproject.toml .github --skip tests/fixtures/page_list_response.json

      - name: APK RE script syntax
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          bash -n \
            tools/apk-re/apk-re-build \
            tools/apk-re/apk-re-decompile \
            tools/apk-re/apk-re-shell \
            tools/apk-re/bin/decompile-apk \
            tools/apk-re/bin/inspect-so \
            tools/apk-re/frida/run-ezviz-hcnetsdk-command-shape-hook \
            tools/apk-re/frida/run-ezviz-lan-settings-hook \
            tools/apk-re/frida/run-ezviz-stream-hook
          python -m py_compile \
            tools/apk-re/bin/cloud-video-native-download \
            tools/apk-re/bin/extract-retrofit-endpoints

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: pip-audit --progress-spinner off

      - name: mypy (auto-install any missing stubs)
        run: mypy --install-types --non-interactive .

      - name: Pyright
        if: matrix.python-version == '3.12'
        run: pyright pyezvizapi

      - name: pytest with coverage (skip gracefully if no tests yet)
        shell: bash
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            pytest --cov=pyezvizapi --cov-report=term-missing --cov-report=xml --cov-fail-under=85
          else
            echo "No tests found under tests/, skipping pytest."
          fi

      - name: Upload coverage XML
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Smoke-test built wheel and CLI
        shell: bash
        run: |
          python -m venv /tmp/pyezvizapi-wheel-smoke
          /tmp/pyezvizapi-wheel-smoke/bin/python -m pip install -U pip
          /tmp/pyezvizapi-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/pyezvizapi-wheel-smoke/bin/python -m pip check
          /tmp/pyezvizapi-wheel-smoke/bin/python -m pyezvizapi --help
          /tmp/pyezvizapi-wheel-smoke/bin/pyezvizapi --help
          /tmp/pyezvizapi-wheel-smoke/bin/python -c "import sys; import pyezvizapi.native_stream; assert 'av' not in sys.modules"

  windows-wsl-entrypoint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    name: Windows WSL entrypoint (PS5 + PS7)
    steps:
      - uses: actions/checkout@v7
      - name: Build synthetic native argument probe (no WSL)
        shell: powershell
        run: |
          $source = @'
          using System;
          using System.IO;
          using System.Text;
          public class LanWslArgvProbe {
            public static int Main(string[] args) {
              File.WriteAllLines(Environment.GetEnvironmentVariable("LAN_WSL_PROBE_LOG"),
                Array.ConvertAll(args, value => Convert.ToBase64String(Encoding.UTF8.GetBytes(value))));
              Console.Error.WriteLine(Environment.GetEnvironmentVariable("LAN_WSL_PROBE_STDERR"));
              return Int32.Parse(Environment.GetEnvironmentVariable("LAN_WSL_PROBE_EXIT"));
            }
          }
          '@
          Add-Type -TypeDefinition $source -OutputAssembly "$env:RUNNER_TEMP\lan-wsl-probe.exe" -OutputType ConsoleApplication
      - name: Windows PowerShell 5 native argv and exit controls
        shell: powershell
        run: .\tests\powershell\test_local_av_lan_session.ps1 -ProbeExecutable "$env:RUNNER_TEMP\lan-wsl-probe.exe"
      - name: PowerShell 7 native argv and exit controls
        shell: pwsh
        run: .\tests\powershell\test_local_av_lan_session.ps1 -ProbeExecutable "$env:RUNNER_TEMP\lan-wsl-probe.exe"
